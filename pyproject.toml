[project]
name = "hermes-codex-factory"
version = "0.1.0"
description = "Brokered, Hermes-supervised Codex software factory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "docker>=7,<8",
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
factory-executor = "factory_executor.app:main"

[tool.setuptools.packages.find]
include = ["factory_executor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
